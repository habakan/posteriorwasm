<!doctype html>
<meta charset="utf-8">
<title>posteriorwasm check</title>
<pre id="status">loading</pre>
<div id="out"></div>
<script type="module">
// Runs every reference case through the worker and leaves the numbers on window
// for the spec; the stuck chain's plots are drawn for a person to look at.
import { createAnalyzer, summaryTable, forestPlot, densityPlot, rankPlot, tracePlot } from "/index.js";

const status = (s) => { document.getElementById("status").textContent = s; };
try {
  const reference = await (await fetch("/test/fixtures/reference.json")).json();
  const analyzer = createAnalyzer({ onProgress: status });
  const t0 = performance.now();
  const versions = await analyzer.ready;
  const bootMs = performance.now() - t0;
  const cases = {};
  let shown;
  for (const [name, c] of Object.entries(reference)) {
    const t = performance.now();
    const r = await analyzer.analyze({ names: c.names, chains: c.chains.map((d) => new Float64Array(d)) });
    cases[name] = { summary: r.summary, ms: performance.now() - t };
    if (name === "stuck_chain") shown = r;
  }
  const out = document.getElementById("out");
  out.innerHTML = summaryTable(shown) + forestPlot(shown) +
    shown.names.map((_, k) => `<div>${densityPlot(shown, k)}${rankPlot(shown, k)}${tracePlot(shown, k)}</div>`).join("");
  status("done");
  window.result = { ok: true, versions, bootMs, cases };
} catch (e) {
  status(String(e));
  window.result = { ok: false, error: String(e) };
}
</script>
